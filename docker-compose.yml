services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academia
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - appnet

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"
    entrypoint: ["sh", "/app/entrypoint.sh"]
    networks:
      - appnet

volumes:
  pgdata:

networks:
  appnet:
    driver: bridge

































